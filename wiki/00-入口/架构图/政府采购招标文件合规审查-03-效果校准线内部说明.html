      <div class="cards"><div class="card"><div class="card-header"><div class="card-dot violet"></div><h3>输入</h3></div><ul><li>AI审查记录、运行记录、业务人员调整意见。</li><li>外部标注只能作为复盘参考。</li></ul></div><div class="card"><div class="card-header"><div class="card-dot amber"></div><h3>处理</h3></div><ul><li>按漏报、误报、拆分、依据、字段和模板问题归因。</li><li>判断项目个案还是可复用知识。</li></ul></div><div class="card"><div class="card-header"><div class="card-dot emerald"></div><h3>输出</h3></div><ul><li>人工调整复盘、知识更新申请、回写后的知识页。</li><li>必要时同步外部执行主体指引。</li></ul></div></div>

  <script>
    const storageKey='政府采购招标文件合规审查-03-效果校准线内部说明.html';
    function toggleEdit(){document.body.classList.toggle('editable-on');const on=document.body.classList.contains('editable-on');document.getElementById('editableSurface').contentEditable=on?'true':'false';document.querySelectorAll('svg text').forEach(t=>t.classList.toggle('svg-text-editing',on));}
    function savePage(){localStorage.setItem(storageKey,document.documentElement.outerHTML);alert('已保存到当前浏览器本地状态');}
    function exportHtml(){const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='政府采购招标文件合规审查-03-效果校准线内部说明.html';a.click();URL.revokeObjectURL(a.href);}
    document.querySelectorAll('svg text').forEach(t=>{t.addEventListener('dblclick',e=>{if(!document.body.classList.contains('editable-on'))return;e.stopPropagation();const old=t.textContent;const next=prompt('编辑文字',old);if(next!==null)t.textContent=next;});});
