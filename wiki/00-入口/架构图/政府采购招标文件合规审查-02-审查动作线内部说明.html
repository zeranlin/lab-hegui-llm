<!DOCTYPE html>

  <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',Arial,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;padding:2rem;overflow-x:hidden}
.container{max-width:1560px;margin:0 auto}.header{margin-bottom:1.7rem}.header-row{display:flex;align-items:center;gap:1rem;margin-bottom:.6rem}
.pulse-dot{width:12px;height:12px;background:#7c3aed;border-radius:50%;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
h1{font-size:1.95rem;font-weight:700;letter-spacing:0;color:#0f172a}.subtitle{color:#334155;font-size:1rem;line-height:1.75;margin-left:1.75rem;max-width:1340px}
.diagram-container{background:rgba(255,255,255,.98);border:1px solid #cbd5e1;border-radius:1rem;padding:1.35rem;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow-x:hidden}
svg{width:100%;max-width:100%;display:block}.cards{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:1rem;margin-top:1.25rem}
.card{background:rgba(255,255,255,.98);border:1px solid #cbd5e1;border-radius:.75rem;padding:1.15rem 1.25rem;box-shadow:0 8px 24px rgba(15,23,42,.06)}

.card h3{font-size:.98rem;font-weight:700;color:#0f172a}.card ul{list-style:none;color:#334155;font-size:.86rem;line-height:1.82}.card li{margin-bottom:.32rem}
.toolbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem;padding:.45rem .75rem;background:rgba(255,255,255,.72);border:1px dashed #cbd5e1;border-radius:.62rem;opacity:.75}
.toolbar button{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:.5rem;padding:.24rem .54rem;font:inherit;font-size:.72rem;cursor:pointer}.toolbar .hint{color:#64748b;font-size:.72rem}
.editable-on .editable-surface{outline:2px dashed rgba(124,58,237,.24);outline-offset:3px;border-radius:.4rem}.svg-text-editing{cursor:text}
.lane{font-size:17px;font-weight:700}.title{font-size:15px;font-weight:700}.line{font-size:10.5px;fill:#334155}.hintText{font-size:11px;fill:#64748b}.tag{font-size:11px;font-weight:700}.small{font-size:10px;fill:#334155}
</style>
</head>

      <div class="cards"><div class="card"><div class="card-header"><div class="card-dot violet"></div><h3>输入</h3></div><ul><li>政府采购采购文件和抽取文本。</li><li>公告、需求、评分、合同、格式都要纳入。</li></ul></div><div class="card"><div class="card-header"><div class="card-dot amber"></div><h3>处理</h3></div><ul><li>先画像，再路由，再生成动作清单。</li><li>逐章逐动作读取，区分存在型和缺失型风险。</li></ul></div><div class="card"><div class="card-header"><div class="card-dot emerald"></div><h3>输出</h3></div><ul><li>AI审查记录给业务人员看。</li><li>运行记录证明执行过程可复现。</li></ul></div></div>

    <div class="toolbar">
      <button onclick="toggleEdit()">编辑</button>
      <button onclick="savePage()">保存</button>
      <button onclick="exportHtml()">导出</button>

  <script>
    const storageKey='政府采购招标文件合规审查-02-审查动作线内部说明.html';
    function toggleEdit(){document.body.classList.toggle('editable-on');const on=document.body.classList.contains('editable-on');document.getElementById('editableSurface').contentEditable=on?'true':'false';document.querySelectorAll('svg text').forEach(t=>t.classList.toggle('svg-text-editing',on));}
    function savePage(){localStorage.setItem(storageKey,document.documentElement.outerHTML);alert('已保存到当前浏览器本地状态');}
    function exportHtml(){const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='政府采购招标文件合规审查-02-审查动作线内部说明.html';a.click();URL.revokeObjectURL(a.href);}
    document.querySelectorAll('svg text').forEach(t=>{t.addEventListener('dblclick',e=>{if(!document.body.classList.contains('editable-on'))return;e.stopPropagation();const old=t.textContent;const next=prompt('编辑文字',old);if(next!==null)t.textContent=next;});});
  </script>
